

services:

  mysql-db:
    restart: always
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Nischay@123
      MYSQL_DATABASE: backend_irctc
    networks:
      - irctc-network

  boot-app:
    image: irctc-backend
    build: .
    container_name: Irctc-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: Irctc-backend
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/backend_irctc
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Nischay@123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
    depends_on:
      - mysql-db
    networks:
      - irctc-network

networks:
  irctc-network:
    driver: bridge